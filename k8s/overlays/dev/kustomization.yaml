apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
replicas:
  - name: web
    count: 1
images:
  - name: visitor-app
    newTag: v1
patches:
  - target:
      kind: ConfigMap
      name: visitor-config
    patch: |-
      - op: replace
        path: /data/ENV_NAME
        value: dev
